function loginPanel(msg=''){const p=$('#cloudPanel');p.innerHTML=`<div class="cloudbox"><div class="eyebrow marker">ATELIER PRIVÉ / V6</div><h2>Bienvenue à l’atelier !</h2>${configured?`<p>Accès réservé aux comptes autorisés par l’établissement.</p><form id="login"><label for="loginEmail">Identifiant ou adresse de connexion</label><input id="loginEmail" type="text" autocapitalize="none" spellcheck="false" autocomplete="username" required><label for="loginPass">Mot de passe</label><input id="loginPass" type="password" autocomplete="current-password" required><button class="btn" type="submit">Entrer dans l’atelier →</button></form>`:'<p>Le mode collaboratif n’est pas encore connecté. Le responsable de l’établissement doit configurer la base et les comptes autorisés. Aucun contenu n’est envoyé.</p>'}<p role="alert" id="loginMsg">${esc(msg)}</p></div>`;if(configured)$('#login').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;let pass=$('#loginPass'), email=$('#loginEmail').value.trim().toLowerCase();if(!email.includes('@'))email+='@example.com';try{session=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password:pass.value})},false);pass.value='';let m=await api('/rest/v1/atelier_members?select=role,first_name&user_id=eq.'+encodeURIComponent(session.user.id));if(m.length!==1)throw Error('Ce compte n’est pas autorisé dans cet atelier.');member=m[0].role;firstName=m[0].first_name;await load();$('#main').hidden=false;$('#nav').hidden=false;render()}catch(err){reset();loginPanel(err.message)}finally{b.disabled=false}}}
async function load(){const generation=epoch;let next=new Map(), result=Object.fromEntries(Object.keys(seed).map(k=>[k,[]]));for(let start=0;;start+=100){let page=await api('/rest/v1/atelier_entries?select=*&order=section.asc,id.asc&limit=100&offset='+start);for(let r of page){if(!Object.hasOwn(result,r.section))continue;let a={id:r.id,author_display:r.author_display||""};for(let [field,,kind,,opts] of specs[r.section]){let v=r.payload?.[field];a[field]=typeof v==='string'?v.slice(0,kind==='file'?500000:4000):'';if(kind==='select'&&!opts.includes(a[field]))a[field]=opts[0];}if(r.section==='journal')a.status=r.moderation==='approved'?'Validé':r.moderation==='revision'?'À corriger':r.moderation==='draft'?'Brouillon':'À relire';next.set(rowKey(r.section,r.id),r);result[r.section].push(a)}if(page.length<100)break}if(generation!==epoch||!member)throw Error('Session fermée.');rows=next;db=result;members=teacher()?await api('/rest/v1/atelier_members?select=user_id,first_name,role&order=first_name'):[];if(generation!==epoch)throw Error('Session fermée.');warning=''}
function panel(){let count=[...rows.values()].filter(r=>r.moderation==='pending').length;$('#cloudPanel').innerHTML=`<div class="cloudbox cloudbar"><strong>${teacher()?'ESPACE ENSEIGNANT':'ESPACE ÉLÈVE'} · ${esc(firstName)} · Atelier privé</strong><span class="tag blue">${teacher()?count+' à relire':'Mes contributions et contenus validés'}</span><button class="btn alt small" data-go="notifications">Mes retours (${[...rows.values()].filter(r=>r.owner_id===session?.user?.id&&r.moderation==='revision').length} à corriger)</button><button class="btn alt small" data-cloud="refresh">Actualiser</button>${teacher()?'<button class="btn alt small" data-cloud="queue">Relectures</button><button class="btn alt small" data-cloud="seed">Compléter les jalons, objectifs et missions</button><button class="btn alt small" data-cloud="dates">Proposer les dates de début</button><button class="btn alt small" data-go="members">Membres</button>':''}<button class="btn alt small" data-cloud="logout">Déconnexion</button></div>`}
function editActions(s,i){if(!configured)return legacyEditActions(s,i);let r=getRow(s,i);if(!r)return '';if(!studentSections.includes(s))return allowedEdit(s,i)?`<div class="actions">${legacyEditActions(s,i)}</div>`:'';let label={draft:'Brouillon',pending:'À relire',revision:'À corriger',approved:'Validé'}[r.moderation];return `<div class="cloud-status">${r.author_display&&s!=="journal"?`<p class="meta">Contribution : ${esc(r.author_display)}</p>`:""}${s==='journal'?'':status(label)}${r.review_note&&(s!=='journal'||(view==='journal'&&journalScope==='personnel')||view==='queue')?`<p class="review-note">Retour enseignant : ${esc(r.review_note)}</p>`:''}</div><div class="actions">${allowedEdit(s,i)?legacyEditActions(s,i):''}${teacher()&&['pending','revision'].includes(r.moderation)?button('Valider',`data-cloud="approve" data-section="${s}" data-id="${esc(i)}"`,'small')+button('Demander une correction',`data-cloud="revision" data-section="${s}" data-id="${esc(i)}"`,'small alt'):''}${teacher()&&r.moderation==='approved'?button('Retirer la validation',`data-cloud="revision" data-section="${s}" data-id="${esc(i)}"`,'small alt'):''}</div>`}
function render(){if(!configured){baseRender();return}if(!member)return;panel();baseRender();document.querySelectorAll('[data-new]').forEach(b=>{if(!allowedNew(b.dataset.new))b.hidden=true});if(!teacher())document.querySelectorAll('[data-action="export"],[data-action="print"]').forEach(b=>b.hidden=true)}
function edit(s,i,preset){if(i?!allowedEdit(s,i):!allowedNew(s))return; baseEdit(s,i,preset);let oldDraft=$('#saveDraft');if(oldDraft)oldDraft.remove();if(s==='journal'&&(!i||(getRow(s,i)?.owner_id===session?.user?.id&&getRow(s,i)?.moderation!=='approved'))){let draft=document.createElement('button');draft.type='submit';draft.id='saveDraft';draft.value='draft';draft.className='btn alt';draft.textContent='Enregistrer en brouillon';$('#form button[type=submit]').before(draft)}let submit=$('#form button[type=submit]:not(#saveDraft)');if(submit)submit.textContent=s==='journal'?'Enregistrer / soumettre':'Enregistrer';let state=$('#f_status');if(s==='journal'&&state){state.parentElement.hidden=true;state.disabled=true}let role=$('#f_role');if(role){role.value=teacher()?'Enseignant':'Élève';role.disabled=true;role.parentElement.hidden=true}if(studentSections.includes(s)){let note=document.createElement("p");note.className="full mini-note";note.textContent="Auteur de la contribution : "+(i?getRow(s,i)?.author_display||firstName:firstName)+" · Signature issue du compte autorisé.";$("#fields").prepend(note)}}
async function saveRow(section,id,payload,old,moderation,review_note=''){const body={payload,moderation,review_note};let path='/rest/v1/atelier_entries';let method='POST';if(old){method='PATCH';path+='?section=eq.'+encodeURIComponent(section)+'&id=eq.'+encodeURIComponent(id)+'&revision=eq.'+old.revision}else Object.assign(body,{section,id});let result=await api(path,{method,headers:{Prefer:'return=representation'},body:JSON.stringify(body)});if(!result?.length)throw Error('Contribution modifiée ailleurs ou accès retiré. Actualisez puis réessayez.')}
$('#form').addEventListener('submit',async e=>{if(!configured)return;e.preventDefault();if(busy||!member)return;let b=e.submitter;b.disabled=true;busy=true;let generation=epoch;try{let {type,id}=editing,old=id?getRow(type,id):null;if(id?!allowedEdit(type,id):!allowedNew(type))throw Error('Action non autorisée.');let data=new FormData(e.target),a={};for(let [name,label,kind,required] of specs[type]){if(name==='status'&&type==='journal'){a[name]='À relire';continue}if(name==='role'&&type==='journal'){a[name]=teacher()?'Enseignant':'Élève';continue}if(kind==='file'){let f=data.get(name);a[name]=f?.size?await convertImage(f):data.has('removeImage')?'':old?.payload?.[name]||'';if(a[name].length>500000)throw Error('Image trop volumineuse après compression.')}else{a[name]=String(data.get(name)||'').trim();if(required&&!a[name])throw Error('Merci de renseigner : '+label)}}if(a.url&&!/^https:\/\//i.test(a.url))throw Error('Utilisez un lien HTTPS.');if(type==='planning'&&a.start&&a.start>a.date)throw Error('La date de début doit précéder la date de fin.');if(generation!==epoch)throw Error('Session fermée.');await saveRow(type,id||uid(),a,old,type==='journal'&&b.value==='draft'?'draft':teacher()?(old&&old.moderation!=='draft'?old.moderation:'approved'):'pending');$('#editor').close();try{await load();if(type==='journal')journalScope='personnel';go(type==='missions'&&a.kind==='Séance'?'seances':type)}catch(err){warning='Saisie enregistrée, actualisation impossible : '+err.message;render()}}catch(err){$('#error').textContent=err.message}finally{busy=false;b.disabled=false}});
function queue(){view='queue';panel();$('#main').innerHTML=head('RELECTURE','Contributions à relire','Valider ou demander une correction avant partage dans l’atelier.')+([...rows.values()].filter(r=>studentSections.includes(r.section)&&['pending','revision'].includes(r.moderation)).map(r=>`<article class="paper"><div class="meta">${esc(r.author_display||"Auteur")} · ${esc(r.section)} · ${esc(r.payload.date||'')}</div><h3>${esc(r.payload.title)}</h3><p>${esc(r.payload.desc)}</p>${specs[r.section].filter(([k])=>!["title","desc","date","image","role","status"].includes(k)&&r.payload[k]).map(([k,label])=>`<p><strong>${esc(label)} :</strong> ${esc(r.payload[k])}</p>`).join("")}${r.payload.image&&/^data:image\/(png|jpeg|webp);base64,/.test(r.payload.image)?`<img class="gallery-img" src="${esc(r.payload.image)}" alt="Trace de création">`:''}${editActions(r.section,r.id)}</article>`).join('')||empty('Aucune contribution en attente.'))}
async function action(d){if(d.cloud==='logout'){reset();loginPanel();return}if(!member||busy)return;busy=true;try{if(d.cloud==='refresh'){await load();view==='queue'&&teacher()?queue():render()}else if(d.cloud==='queue'&&teacher()){await load();queue()}else if(d.cloud==='dates'&&teacher()){if(!confirm('Ajouter les dates de début indicatives aux jalons initiaux sans date de début ? Les autres dates et contributions sont conservées, sauf les fins proposées pour PFMP et Rome si leur date initiale est inchangée.'))return;for(const a of seed.planning){const r=getRow('planning',a.id);if(!r||r.payload.start||r.payload.title!==a.title)continue;let payload={...r.payload};let end=payload.date;if(a.id==='m6'&&end==='2027-05-03'||a.id==='m9'&&end==='2027-01-11')end=a.date;if(a.start<=end){payload.start=a.start;payload.date=end;await saveRow('planning',r.id,payload,r,r.moderation,r.review_note)}}await load();go('planning')}else if(d.cloud==='seed'&&teacher()){if(!confirm('Ajouter seulement les jalons, objectifs, missions et séance absents ?'))return;let existing=[...rows.keys()];let entries=['planning','objectifs','missions'].flatMap(section=>seed[section].filter(a=>!existing.includes(rowKey(section,a.id))).map(({id,...payload})=>({section,id,payload,moderation:'approved'})));if(entries.length)await api('/rest/v1/atelier_entries?on_conflict=section,id',{method:'POST',headers:{Prefer:'resolution=ignore-duplicates'},body:JSON.stringify(entries)});await load();go('conduire')}else if(['approve','revision'].includes(d.cloud)&&teacher()){let r=getRow(d.section,d.id);if(!r)return;let note=d.cloud==='revision'?prompt('Retour à transmettre (sans données personnelles) :',''):'';if(note===null)return;await saveRow(r.section,r.id,r.payload,r,d.cloud==='approve'?'approved':'revision',note.slice(0,1000));await load();view==='queue'?queue():render()}else if(d.del&&allowedEdit(d.del,d.id)&&confirm('Supprimer cette contribution ?')){let r=getRow(d.del,d.id);let result=await api('/rest/v1/atelier_entries?section=eq.'+encodeURIComponent(r.section)+'&id=eq.'+encodeURIComponent(r.id)+'&revision=eq.'+r.revision,{method:'DELETE',headers:{Prefer:'return=representation'}});if(!result?.length)throw Error('Suppression refusée : actualisez.');await load();view==='queue'?queue():render()}}catch(err){alert(err.message)}finally{busy=false}}
document.addEventListener('click',e=>{if(!configured)return;let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.cloud||d.del){action(d);return}if(!member||busy)return;if(d.journalScope){journalScope=d.journalScope;search="";filter="Tous";go('journal')}else if(d.go)go(d.go);else if(d.new){edit(d.new,undefined,d.preset);if(d.session==='yes'&&$('#f_kind'))$('#f_kind').value='Séance';if(d.sessionJournal&&$('#f_title')){const a=db.missions.find(x=>x.id===d.sessionJournal);if(a){$('#f_title').value=a.title;$('#f_desc').placeholder=a.trace||'Raconte cette séance.'}}if(d.chapter==='001'&&allowedNew(d.new)&&$('#f_title')){$('#f_title').value='Et si tout commençait par un besoin ?';$('#f_desc').placeholder='Que constatons-nous ? Quel besoin identifions-nous et sur quels éléments nous appuyons-nous ?';$('#f_learn').placeholder='Qu’avons-nous compris du lien humain ?';$('#f_next').placeholder='Quelle réponse pourrions-nous explorer ou tester ?';}}else if(d.edit)edit(d.edit,d.id);else if(d.action==='print'&&teacher())window.print();else if(d.action==='export'&&teacher())download()});
// Aperçu public interactif : aucune connexion, aucun stockage persistant, aucun envoi.
function startDemo(){
  db=JSON.parse(JSON.stringify(seed));
  $('#main').hidden=false;$('#nav').hidden=false;
  $('#cloudPanel').innerHTML=`<div class="demo-strip"><div><strong>MODE DÉMONSTRATION / WORK IN PROGRESS</strong><span>Explorez librement. Saisies fictives uniquement, effacées à la fermeture ou au rechargement. Aucun envoi.</span></div><button class="btn alt small" data-demo="reset">Réinitialiser l’essai</button></div>`;
  document.querySelector('footer').textContent='WORK IN PROGRESS / V6 · DÉMONSTRATION LOCALE · Ne saisissez aucune donnée personnelle. La collaboration sera activée après configuration et validation.';
  document.querySelector('#editor .mini-note').textContent='Mode démonstration : utilisez uniquement des exemples fictifs, sans noms, coordonnées ni photos de personnes.';
  render();
  document.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;const d=b.dataset;
    if(d.demo==='reset'){if(confirm('Effacer les saisies de démonstration et revenir aux jalons initiaux ?')){db=JSON.parse(JSON.stringify(seed));go('accueil')}return}
    if(d.journalScope){journalScope=d.journalScope;search='';filter='Tous';render();return}if(d.go){go(d.go);return}
    if(d.new){baseEdit(d.new,undefined,d.preset);if(d.chapter==='001'&&$('#f_title')){$('#f_title').value='Et si tout commençait par un besoin ?';$('#f_desc').placeholder='Que constatons-nous ? Quel besoin identifions-nous ?';$('#f_learn').placeholder='Qu’avons-nous compris du lien humain ?';$('#f_next').placeholder='Quelle réponse pourrions-nous explorer ?'}return}
    if(d.edit){baseEdit(d.edit,d.id);return}
    if(d.del&&confirm('Supprimer cette saisie de démonstration ?')){db[d.del]=db[d.del].filter(a=>a.id!==d.id);render();return}
    if(d.action==='print'){window.print();return}
    if(d.action==='export'){download();return}
  });
  $('#form').addEventListener('submit',async e=>{
    e.preventDefault();if(busy)return;busy=true;const b=e.submitter;b.disabled=true;
    try{const {type,id}=editing,old=id?db[type].find(a=>a.id===id):null,fd=new FormData(e.target),a={id:id||uid()};
      for(const [name,label,kind,required] of specs[type]){
        if(kind==='file'){const f=fd.get(name);a[name]=f?.size?await convertImage(f):fd.has('removeImage')?'':old?.[name]||''}
        else{a[name]=String(fd.get(name)||'').trim();if(required&&!a[name])throw Error('Merci de renseigner : '+label)}
      }
      if(a.url&&!/^https:\/\//i.test(a.url))throw Error('Utilisez un lien HTTPS.');
      if(old)db[type]=db[type].map(v=>v.id===id?a:v);else db[type].push(a);
      $('#editor').close();go(type);
    }catch(err){$('#error').textContent=err.message}finally{busy=false;b.disabled=false}
  });
}
if(configured)loginPanel();else startDemo();

</script></body></html>
