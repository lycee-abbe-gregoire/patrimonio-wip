function stats(){let done=db.planning.filter(a=>a.status==='Terminé').length, pct=db.planning.length?Math.round(done/db.planning.length*100):0;return `<div class="stats"><div class="stat"><div class="number">${approvedJournal().length}</div><small>Traces de création validées</small></div><div class="stat"><div class="number">${done}/${db.planning.length}</div><small>Jalons réalisés</small></div><div class="stat"><div class="number">${db.objectifs.filter(a=>a.status==='Terminé').length}/${db.objectifs.length}</div><small>Objectifs atteints</small></div><div class="stat"><div class="number">${pct}%</div><small>Jalons terminés</small><div class="progress"><i style="width:${pct}%"></i></div></div></div>`}
const worlds=[['imaginer','Imaginer','Observer les besoins, questionner, imaginer des réponses.','#f5d638','-1.2deg'],['construire','Construire','Les essais, les prototypes, la matière.','#f5c4ce','1deg'],['conduire','Conduire','Les objectifs, les missions, les échéances.','#d2defe','-0.7deg'],['journal','Journal de bord','Vivre : les moments, les souvenirs, les rencontres.','#cce3ba','1deg'],['partager','Partager','Les propositions et les ressources collectives.','#facb9c','-1deg'],['rayonner','Rayonner','La restitution, le portfolio, Rome.','#ddd0f3','1.1deg']];
function links(items){return `<div class="hub-links">${items.map(([v,t])=>button(t,`data-go="${v}"`)).join('')}</div>`}
function approvedJournal(){return db.journal.filter(a=>a.status==='Validé')}function mineJournal(){return configured?db.journal.filter(a=>getRow('journal',a.id)?.owner_id===session?.user?.id):db.journal}function newest(){return approvedJournal().slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3)}
function quick(){return `<div class="quick">${[['Petite victoire','Une victoire'],['Souvenir d’atelier','Un souvenir'],['Création & expérimentation','Un essai'],['Difficulté & solution','Une difficulté'],['Parole d’atelier','Une parole']].map(([c,t])=>`<button data-new="journal" data-preset="${esc(c)}">+ ${t}</button>`).join('')}</div>`}
function foundations(full){return `<section class="foundation"><div class="eyebrow marker">CHAPITRE 001 / LA GENÈSE</div><h2>Et si tout commençait par un besoin ?</h2><p>Du besoin humain à la création collective.</p>${full?`<div class="foundation-steps">${[['Observer','Que constatons-nous ?'],['Questionner','À quel besoin répondre ?'],['Imaginer','Quelles réponses inventer ?'],['Expérimenter','Comment donner forme à notre idée ?'],['Évaluer','Notre création répond-elle au besoin ?'],['Transmettre','Quelle empreinte laisserons-nous ?']].map(([a,b],i)=>`<div style="--step:${['#f5d638','#f5c4ce','#d2defe','#cce3ba','#facb9c','#ddd0f3'][i]}"><small>0${i+1} /</small><strong>${a}</strong><span>${b}</span></div>`).join('')}</div><p><strong>Nos questions de départ :</strong> Qu’est-ce qui nous relie aux autres ? Qu’est-ce qui fragilise le lien social ? Que pouvons-nous transmettre ? Comment une création peut-elle favoriser les relations humaines ?</p>`:''}<div class="actions">${button('Ouvrir une page du chapitre 001','data-new="journal" data-preset="Recherches &amp; inspirations" data-chapter="001"')}${full?'':button('Explorer la démarche','data-go="imaginer"','alt')}</div><p class="mini-note">Une invitation à observer et à réfléchir, pas un compte rendu déjà réalisé.</p></section>`}
function home(){let next=db.planning.filter(a=>a.status!=='Terminé').sort((a,b)=>a.date.localeCompare(b.date))[0],days=Math.ceil((Date.parse('2027-05-03T00:00:00Z')-Date.parse(today()+'T00:00:00Z'))/86400000);return `<div class="hero"><div><span class="highlight">VILLA MÉDICIS / 2026—2027</span><h1>PATRIMONIO<span>WORK IN PROGRESS.</span></h1><p><strong>[RE]naissance — Le carnet vivant d’une création collective.</strong></p><p>Imaginer l’œuvre. Construire le projet. Vivre l’aventure. Transmettre l’expérience.</p><div class="founding-words"><strong>Un besoin.</strong><strong>Une réponse.</strong><strong>Une empreinte.</strong></div><div class="actions">${button('+ Saisir un moment','data-new="journal"')}${button('Ouvrir le journal de bord','data-go="journal"','alt')}${button('Où en sommes-nous ?','data-go="conduire"','alt')}</div><p class="hand">Ce que nous créons compte autant que ce que nous vivons !</p></div>${sketch}</div>${sessionCards(false)}${foundations(false)}<div class="route"><strong>PARIS</strong><span class="dotted"></span><a class="roma-link" href="https://villamedici.it/fr/" target="_blank" rel="noopener noreferrer" aria-label="Découvrir la Villa Médicis, nouvel onglet"><strong>ROMA ↗</strong></a><span class="count">${days>0?'J − '+days:'3—7 MAI 2027'}<br>3—7 mai 2027 · prévu</span></div><div class="eyebrow marker">01—06 / À ouvrir, à faire vivre</div><div class="universe">${worlds.map(([v,t,d,c,r],i)=>`<button class="ticket" style="--shade:${c};--tilt:${r}" data-go="${v}"><span class="n">0${i+1} /</span><span class="word">${t}</span><span class="description">${d}</span><span class="arr">↗</span></button>`).join('')}</div><div class="todayboard"><div><div class="eyebrow">LE PROCHAIN JALON NON TERMINÉ</div><h3>${next?esc(next.title):db.planning.length?'Tous les jalons sont terminés.':'Notre projet commence !'}</h3>${next?`<p>${fmt(next.date)} · ${esc(next.track)} · ${esc(next.status)}</p>`:''}${!db.planning.length?`<p>${teacher()?'Chargez les jalons et objectifs proposés depuis le bandeau enseignant.':'Les enseignants préparent l’échéancier.'}</p>`:''}${button('Suivre la progression','data-go="planning"','small alt')}</div><div><div class="eyebrow marker">ET AUJOURD’HUI ?</div><h3>Qu’avons-nous vécu ?</h3>${quick()}<p class="mini-note">Une trace, même toute petite, fait partie de notre histoire.</p></div></div>${stats()}<div class="section-head"><div><div class="eyebrow marker">Les dernières pages</div><h2>L’aventure s’écrit.</h2></div>${button('Tout le journal','data-go="journal"','alt')}</div>${newest().length?`<div class="cards">${newest().map(cardJournal).join('')}</div>`:empty('Notre histoire reste à écrire. Ajoutez la première contribution.')}`}
function hub(n,t,d,items,extra=''){return head(n,t,d)+links(items)+extra}
function sessionCards(all){let arr=db.missions.filter(x=>x.kind==='Séance').sort((a,b)=>a.date.localeCompare(b.date));if(!all)arr=arr.filter(x=>x.date>=today()&&x.status!=='Terminé').slice(0,1);return `<section class="rendezvous"><div class="section-head"><div><div class="eyebrow marker">LE RENDEZ-VOUS D’ATELIER</div><h2>${all?'Les séances.':'Aujourd’hui, on fait quoi ?'}</h2></div>${button('Toutes les séances','data-go="seances"','alt')}</div>${arr.length?arr.map(a=>`<article class="session-sheet"><div class="eyebrow">${fmt(a.date)} · ${esc(a.duration||'Durée à définir')} · ${status(a.status)}</div><h3>${esc(a.title)}</h3><div class="session-grid"><div><strong>Notre défi</strong><p>${esc(a.desc)}</p></div><div><strong>Ce que nous devons comprendre</strong><p>${esc(a.understand||'À préciser')}</p></div><div><strong>Ce que nous devons produire</strong><p>${esc(a.proof||'À préciser')}</p></div><div><strong>La trace que nous laissons</strong><p>${esc(a.trace||'Une page de journal')}</p></div></div>${button('Écrire ma trace','data-new="journal" data-session-journal="'+esc(a.id)+'"')}${editActions('missions',a.id)}</article>`).join(''):empty(all?'Aucune séance prévue.':'Le prochain rendez-vous sera préparé par les enseignants.')}</section>`}
function genericCards(type){let arr=db[type].filter(a=>type!=='missions'||a.kind!=='Séance').sort((a,b)=>(b.date||'').localeCompare(a.date||''));return arr.length?`<div class="cards">${arr.map(a=>`<article class="paper"><div class="meta">${fmt(a.date)} ${a.category?' · '+esc(a.category):''}</div>${a.status?status(a.status):''}<h3>${esc(a.title)}</h3>${a.team?`<p class="sub">Groupe / rôle : ${esc(a.team)}</p>`:''}${type==='missions'&&a.assignee?`<p><strong>Attribution :</strong> ${a.assignee===session?.user?.id?'Ma mission':teacher()?esc(members.find(m=>m.user_id===a.assignee)?.first_name||'Membre autorisé'):'Mission individuelle'}</p>`:''}<p>${esc(a.desc)}</p>${a.next?`<p><strong>À suivre :</strong> ${esc(a.next)}</p>`:''}${a.proof?`<p><strong>Trace :</strong> ${esc(a.proof)}</p>`:''}${editActions(type,a.id)}</article>`).join('')}</div>`:empty('Aucune entrée pour le moment. À nous de jouer !')}
function baseRender(){ $('#nav').innerHTML=tabs.map(([v,t])=>`<button data-go="${v}" class="${view===v?'active':''}" ${view===v?'aria-current="page"':''}>${t}</button>`).join('');let out='';if(view==='accueil')out=home();
if(view==='imaginer')out=hub('01','Imaginer.','Et si tout commençait par un besoin ? Observer, questionner, puis imaginer une réponse.',[['objectifs','Nos intentions & objectifs'],['ressources','Mur d’inspiration'],['idees','Boîte à idées'],['capsules','Capsule temporelle']],`<div class="hub-banner"><div class="eyebrow marker">NOTRE QUESTION FONDATRICE</div><h2>Comment créer du lien humain ?</h2><p>Le distributeur d’XPériences humaines est une réponse créative à explorer, à éprouver et à ajuster au regard des besoins observés.</p></div>${foundations(true)}${sketch}`);
if(view==='construire')out=hub('02','Construire.','De l’idée à la matière : croquis, essais, prototypes et choix de fabrication.',[['prototypes','Galerie des prototypes'],['planning','Progressions'],['decisions','Carnet des décisions'],['missions','Missions d’atelier']],`<div class="note"><strong>Le droit à l’essai.</strong> Une idée abandonnée, une difficulté ou un prototype imparfait sont des traces utiles.</div>${button('+ Documenter un essai','data-new="journal" data-preset="Création &amp; expérimentation"')}`);
if(view==='seances')out=head('03 / ATELIER','Les rendez-vous d’atelier.','Un défi, des apprentissages, une production et une trace.',button('+ Préparer une séance','data-new="missions" data-session="yes"'))+sessionCards(true);

async function load(){const generation=epoch;let next=new Map(), result=Object.fromEntries(Object.keys(seed).map(k=>[k,[]]));for(let start=0;;start+=100){let page=await api('/rest/v1/atelier_entries?select=*&order=section.asc,id.asc&limit=100&offset='+start);for(let r of page){if(!Object.hasOwn(result,r.section))continue;let a={id:r.id,author_display:r.author_display||""};for(let [field,,kind,,opts] of specs[r.section]){let v=r.payload?.[field];a[field]=typeof v==='string'?v.slice(0,kind==='file'?500000:4000):'';if(kind==='select'&&!opts.includes(a[field]))a[field]=opts[0];}if(r.section==='journal')a.status=r.moderation==='approved'?'Validé':r.moderation==='revision'?'À corriger':r.moderation==='draft'?'Brouillon':'À relire';next.set(rowKey(r.section,r.id),r);result[r.section].push(a)}if(page.length<100)break}if(generation!==epoch||!member)throw Error('Session fermée.');rows=next;db=result;members=teacher()?await api('/rest/v1/atelier_members?select=user_id,first_name,role&order=first_name'):[];if(generation!==epoch)throw Error('Session fermée.');warning=''}

function ownPassId(){const mail=String(session?.user?.email||'');return mail.toLowerCase().endsWith('@example.com')?mail.slice(0,-12):mail;}
function passPage(){return head('ATELIER PRIVÉ','Mon pass atelier.','Une carte personnelle pour entrer dans l’aventure. Le QR code est réservé au pass imprimable.')+`<section class="pass-wrap">${teacher()?`<div class="pass-controls"><label for="passMember">Préparer le pass d’un membre autorisé</label><select id="passMember"><option value="">Mon propre pass</option>${members.filter(m=>m.user_id!==session?.user?.id).map(m=>`<option value="${esc(m.user_id)}">${esc(m.first_name)} · ${esc(m.role)}</option>`).join('')}</select><label for="passIdentifier">Identifiant attribué dans Supabase (à vérifier)</label><input id="passIdentifier" value="${esc(ownPassId())}" maxlength="180" autocomplete="off" spellcheck="false"><small>Le prénom vient du compte sélectionné ; pour un autre membre, renseignez son véritable identifiant de connexion. Aucun mot de passe ici. La saisie n’est pas enregistrée.</small></div>`:''}<article id="atelierPass" class="pass-ticket"><div class="pass-top"><span>ABBÉ GRÉGOIRE × VILLA MÉDICIS</span><span>PARIS → ROMA / 2027</span></div><div class="pass-title">PATRIMONIO</div><div class="pass-sub">WORK IN PROGRESS.</div><div class="pass-band">PASS ATELIER / [RE]naissance</div><div class="pass-grid"><div class="pass-fields"><div><small>MON PRÉNOM</small><strong id="passName">${esc(firstName)}</strong></div><div><small>MON IDENTIFIANT</small><span class="pass-id" id="passId">${esc(ownPassId()||'À renseigner')}</span></div><div><small>MON RÔLE</small><span class="pass-role" id="passRole">${teacher()?'Enseignant · guide de l’atelier':'Élève · co-auteur du projet'}</span></div></div><div class="pass-qr"><img src="${passQR}" alt="QR code vers PATRIMONIO"><span>ACCÈS À L’ATELIER</span></div></div><div class="pass-foot">Un besoin. Une réponse. Une empreinte.</div></article><div class="pass-tools"><button id="printPass" class="btn" type="button">Imprimer mon pass / PDF</button></div><p class="pass-hint">Carte individuelle à conserver. Le mot de passe est communiqué séparément. Le QR code figure sur la carte imprimée : il ouvre le site sans donner accès au compte.</p></section>`;}
function bindPass(){let sel=$('#passMember'),input=$('#passIdentifier'),print=$('#printPass');if(!print)return;function sync(){let m=sel?.value?members.find(x=>x.user_id===sel.value):null;$('#passName').textContent=m?.first_name||firstName;$('#passRole').textContent=(m?m.role==='enseignant':teacher())?'Enseignant · guide de l’atelier':'Élève · co-auteur du projet';let id=input?input.value.trim():ownPassId();$('#passId').textContent=id||'À renseigner';print.disabled=!id;}if(sel)sel.onchange=()=>{input.value=sel.value?'':ownPassId();sync()};if(input)input.oninput=sync;print.onclick=()=>{if(print.disabled)return;document.body.classList.add('print-pass');try{window.print()}finally{document.body.classList.remove('print-pass')}};sync();}

function panel(){let count=[...rows.values()].filter(r=>r.moderation==='pending').length;$('#cloudPanel').innerHTML=`<div class="cloudbox cloudbar"><strong>${teacher()?'ESPACE ENSEIGNANT':'ESPACE ÉLÈVE'} · ${esc(firstName)} · Atelier privé</strong><span class="tag blue">${teacher()?count+' à relire':'Mes contributions et contenus validés'}</span><button class="btn alt small" data-go="notifications">Mes retours (${[...rows.values()].filter(r=>r.owner_id===session?.user?.id&&r.moderation==='revision').length} à corriger)</button><button class="btn alt small" data-cloud="refresh">Actualiser</button>${teacher()?'<button class="btn alt small" data-cloud="queue">Relectures</button><button class="btn alt small" data-cloud="seed">Compléter les jalons, objectifs et missions</button><button class="btn alt small" data-cloud="dates">Proposer les dates de début</button><button class="btn alt small" data-go="members">Membres</button>':''}<button class="btn alt small" data-go="pass">Mon pass atelier</button><button class="btn alt small" data-cloud="logout">Déconnexion</button></div>`}
function editActions(s,i){if(!configured)return legacyEditActions(s,i);let r=getRow(s,i);if(!r)return '';if(!studentSections.includes(s))return allowedEdit(s,i)?`<div class="actions">${legacyEditActions(s,i)}</div>`:'';let label={draft:'Brouillon',pending:'À relire',revision:'À corriger',approved:'Validé'}[r.moderation];return `<div class="cloud-status">${r.author_display&&s!=="journal"?`<p class="meta">Contribution : ${esc(r.author_display)}</p>`:""}${s==='journal'?'':status(label)}${r.review_note&&(s!=='journal'||(view==='journal'&&journalScope==='personnel')||view==='queue')?`<p class="review-note">Retour enseignant : ${esc(r.review_note)}</p>`:''}</div><div class="actions">${allowedEdit(s,i)?legacyEditActions(s,i):''}${teacher()&&['pending','revision'].includes(r.moderation)?button('Valider',`data-cloud="approve" data-section="${s}" data-id="${esc(i)}"`,'small')+button('Demander une correction',`data-cloud="revision" data-section="${s}" data-id="${esc(i)}"`,'small alt'):''}${teacher()&&r.moderation==='approved'?button('Retirer la validation',`data-cloud="revision" data-section="${s}" data-id="${esc(i)}"`,'small alt'):''}</div>`}
function render(){if(!configured){baseRender();return}if(!member)return;panel();baseRender();if(view==='pass')bindPass();document.querySelectorAll('[data-new]').forEach(b=>{if(!allowedNew(b.dataset.new))b.hidden=true});if(!teacher())document.querySelectorAll('[data-action="export"],[data-action="print"]').forEach(b=>b.hidden=true)}
function edit(s,i,preset){if(i?!allowedEdit(s,i):!allowedNew(s))return; baseEdit(s,i,preset);let oldDraft=$('#saveDraft');if(oldDraft)oldDraft.remove();if(s==='journal'&&(!i||(getRow(s,i)?.owner_id===session?.user?.id&&getRow(s,i)?.moderation!=='approved'))){let draft=document.createElement('button');draft.type='submit';draft.id='saveDraft';draft.value='draft';draft.className='btn alt';draft.textContent='Enregistrer en brouillon';$('#form button[type=submit]').before(draft)}let submit=$('#form button[type=submit]:not(#saveDraft)');if(submit)submit.textContent=s==='journal'?'Enregistrer / soumettre':'Enregistrer';let state=$('#f_status');if(s==='journal'&&state){state.parentElement.hidden=true;state.disabled=true}let role=$('#f_role');if(role){role.value=teacher()?'Enseignant':'Élève';role.disabled=true;role.parentElement.hidden=true}if(studentSections.includes(s)){let note=document.createElement("p");note.className="full mini-note";note.textContent="Auteur de la contribution : "+(i?getRow(s,i)?.author_display||firstName:firstName)+" · Signature issue du compte autorisé.";$("#fields").prepend(note)}}
async function saveRow(section,id,payload,old,moderation,review_note=''){const body={payload,moderation,review_note};let path='/rest/v1/atelier_entries';let method='POST';if(old){method='PATCH';path+='?section=eq.'+encodeURIComponent(section)+'&id=eq.'+encodeURIComponent(id)+'&revision=eq.'+old.revision}else Object.assign(body,{section,id});let result=await api(path,{method,headers:{Prefer:'return=representation'},body:JSON.stringify(body)});if(!result?.length)throw Error('Contribution modifiée ailleurs ou accès retiré. Actualisez puis réessayez.')}
$('#form').addEventListener('submit',async e=>{if(!configured)return;e.preventDefault();if(busy||!member)return;let b=e.submitter;b.disabled=true;busy=true;let generation=epoch;try{let {type,id}=editing,old=id?getRow(type,id):null;if(id?!allowedEdit(type,id):!allowedNew(type))throw Error('Action non autorisée.');let data=new FormData(e.target),a={};for(let [name,label,kind,required] of specs[type]){if(name==='status'&&type==='journal'){a[name]='À relire';continue}if(name==='role'&&type==='journal'){a[name]=teacher()?'Enseignant':'Élève';continue}if(kind==='file'){let f=data.get(name);a[name]=f?.size?await convertImage(f):data.has('removeImage')?'':old?.payload?.[name]||'';if(a[name].length>500000)throw Error('Image trop volumineuse après compression.')}else{a[name]=String(data.get(name)||'').trim();if(required&&!a[name])throw Error('Merci de renseigner : '+label)}}if(a.url&&!/^https:\/\//i.test(a.url))throw Error('Utilisez un lien HTTPS.');if(type==='planning'&&a.start&&a.start>a.date)throw Error('La date de début doit précéder la date de fin.');if(generation!==epoch)throw Error('Session fermée.');await saveRow(type,id||uid(),a,old,type==='journal'&&b.value==='draft'?'draft':teacher()?(old&&old.moderation!=='draft'?old.moderation:'approved'):'pending');$('#editor').close();try{await load();if(type==='journal')journalScope='personnel';go(type==='missions'&&a.kind==='Séance'?'seances':type)}catch(err){warning='Saisie enregistrée, actualisation impossible : '+err.message;render()}}catch(err){$('#error').textContent=err.message}finally{busy=false;b.disabled=false}});
function queue(){view='queue';panel();$('#main').innerHTML=head('RELECTURE','Contributions à relire','Valider ou demander une correction avant partage dans l’atelier.')+([...rows.values()].filter(r=>studentSections.includes(r.section)&&['pending','revision'].includes(r.moderation)).map(r=>`<article class="paper"><div class="meta">${esc(r.author_display||"Auteur")} · ${esc(r.section)} · ${esc(r.payload.date||'')}</div><h3>${esc(r.payload.title)}</h3><p>${esc(r.payload.desc)}</p>${specs[r.section].filter(([k])=>!["title","desc","date","image","role","status"].includes(k)&&r.payload[k]).map(([k,label])=>`<p><strong>${esc(label)} :</strong> ${esc(r.payload[k])}</p>`).join("")}${r.payload.image&&/^data:image\/(png|jpeg|webp);base64,/.test(r.payload.image)?`<img class="gallery-img" src="${esc(r.payload.image)}" alt="Trace de création">`:''}${editActions(r.section,r.id)}</article>`).join('')||empty('Aucune contribution en attente.'))}
async function action(d){if(d.cloud==='logout'){reset();loginPanel();return}if(!member||busy)return;busy=true;try{if(d.cloud==='refresh'){await load();view==='queue'&&teacher()?queue():render()}else if(d.cloud==='queue'&&teacher()){await load();queue()}else if(d.cloud==='dates'&&teacher()){if(!confirm('Ajouter les dates de début indicatives aux jalons initiaux sans date de début ? Les autres dates et contributions sont conservées, sauf les fins proposées pour PFMP et Rome si leur date initiale est inchangée.'))return;for(const a of seed.planning){const r=getRow('planning',a.id);if(!r||r.payload.start||r.payload.title!==a.title)continue;let payload={...r.payload};let end=payload.date;if(a.id==='m6'&&end==='2027-05-03'||a.id==='m9'&&end==='2027-01-11')end=a.date;if(a.start<=end){payload.start=a.start;payload.date=end;await saveRow('planning',r.id,payload,r,r.moderation,r.review_note)}}await load();go('planning')}else if(d.cloud==='seed'&&teacher()){if(!confirm('Ajouter seulement les jalons, objectifs, missions et séance absents ?'))return;let existing=[...rows.keys()];let entries=['planning','objectifs','missions'].flatMap(section=>seed[section].filter(a=>!existing.includes(rowKey(section,a.id))).map(({id,...payload})=>({section,id,payload,moderation:'approved'})));if(entries.length)await api('/rest/v1/atelier_entries?on_conflict=section,id',{method:'POST',headers:{Prefer:'resolution=ignore-duplicates'},body:JSON.stringify(entries)});await load();go('conduire')}else if(['approve','revision'].includes(d.cloud)&&teacher()){let r=getRow(d.section,d.id);if(!r)return;let note=d.cloud==='revision'?prompt('Retour à transmettre (sans données personnelles) :',''):'';if(note===null)return;await saveRow(r.section,r.id,r.payload,r,d.cloud==='approve'?'approved':'revision',note.slice(0,1000));await load();view==='queue'?queue():render()}else if(d.del&&allowedEdit(d.del,d.id)&&confirm('Supprimer cette contribution ?')){let r=getRow(d.del,d.id);let result=await api('/rest/v1/atelier_entries?section=eq.'+encodeURIComponent(r.section)+'&id=eq.'+encodeURIComponent(r.id)+'&revision=eq.'+r.revision,{method:'DELETE',headers:{Prefer:'return=representation'}});if(!result?.length)throw Error('Suppression refusée : actualisez.');await load();view==='queue'?queue():render()}}catch(err){alert(err.message)}finally{busy=false}}
document.addEventListener('click',e=>{if(!configured)return;let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.cloud||d.del){action(d);return}if(!member||busy)return;if(d.journalScope){journalScope=d.journalScope;search="";filter="Tous";go('journal')}else if(d.go)go(d.go);else if(d.new){edit(d.new,undefined,d.preset);if(d.session==='yes'&&$('#f_kind'))$('#f_kind').value='Séance';if(d.sessionJournal&&$('#f_title')){const a=db.missions.find(x=>x.id===d.sessionJournal);if(a){$('#f_title').value=a.title;$('#f_desc').placeholder=a.trace||'Raconte cette séance.'}}if(d.chapter==='001'&&allowedNew(d.new)&&$('#f_title')){$('#f_title').value='Et si tout commençait par un besoin ?';$('#f_desc').placeholder='Que constatons-nous ? Quel besoin identifions-nous et sur quels éléments nous appuyons-nous ?';$('#f_learn').placeholder='Qu’avons-nous compris du lien humain ?';$('#f_next').placeholder='Quelle réponse pourrions-nous explorer ou tester ?';}}else if(d.edit)edit(d.edit,d.id);else if(d.action==='print'&&teacher())window.print();else if(d.action==='export'&&teacher())download()});
// Aperçu public interactif : aucune connexion, aucun stockage persistant, aucun envoi.
function startDemo(){
  db=JSON.parse(JSON.stringify(seed));
  $('#main').hidden=false;$('#nav').hidden=false;
  $('#cloudPanel').innerHTML=`<div class="demo-strip"><div><strong>MODE DÉMONSTRATION / WORK IN PROGRESS</strong><span>Explorez librement. Saisies fictives uniquement, effacées à la fermeture ou au rechargement. Aucun envoi.</span></div><button class="btn alt small" data-demo="reset">Réinitialiser l’essai</button></div>`;
  document.querySelector('footer').textContent='WORK IN PROGRESS / V6 · DÉMONSTRATION LOCALE · Ne saisissez aucune donnée personnelle. La collaboration sera activée après configuration et validation.';
  document.querySelector('#editor .mini-note').textContent='Mode démonstration : utilisez uniquement des exemples fictifs, sans noms, coordonnées ni photos de personnes.';
  render();
  document.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;const d=b.dataset;
    if(d.demo==='reset'){if(confirm('Effacer les saisies de démonstration et revenir aux jalons initiaux ?')){db=JSON.parse(JSON.stringify(seed));go('accueil')}return}
    if(d.journalScope){journalScope=d.journalScope;search='';filter='Tous';render();return}if(d.go){go(d.go);return}
    if(d.new){baseEdit(d.new,undefined,d.preset);if(d.chapter==='001'&&$('#f_title')){$('#f_title').value='Et si tout commençait par un besoin ?';$('#f_desc').placeholder='Que constatons-nous ? Quel besoin identifions-nous ?';$('#f_learn').placeholder='Qu’avons-nous compris du lien humain ?';$('#f_next').placeholder='Quelle réponse pourrions-nous explorer ?'}return}
    if(d.edit){baseEdit(d.edit,d.id);return}
    if(d.del&&confirm('Supprimer cette saisie de démonstration ?')){db[d.del]=db[d.del].filter(a=>a.id!==d.id);render();return}
    if(d.action==='print'){window.print();return}
    if(d.action==='export'){download();return}
  });
  $('#form').addEventListener('submit',async e=>{
    e.preventDefault();if(busy)return;busy=true;const b=e.submitter;b.disabled=true;
    try{const {type,id}=editing,old=id?db[type].find(a=>a.id===id):null,fd=new FormData(e.target),a={id:id||uid()};
      for(const [name,label,kind,required] of specs[type]){
        if(kind==='file'){const f=fd.get(name);a[name]=f?.size?await convertImage(f):fd.has('removeImage')?'':old?.[name]||''}
        else{a[name]=String(fd.get(name)||'').trim();if(required&&!a[name])throw Error('Merci de renseigner : '+label)}
      }
      if(a.url&&!/^https:\/\//i.test(a.url))throw Error('Utilisez un lien HTTPS.');
      if(old)db[type]=db[type].map(v=>v.id===id?a:v);else db[type].push(a);
      $('#editor').close();go(type);
    }catch(err){$('#error').textContent=err.message}finally{busy=false;b.disabled=false}
  });
}
if(configured)loginPanel();else startDemo();
