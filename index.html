});const nouns={journal:'contribution',planning:'jalon',objectifs:'objectif',ressources:'ressource',decisions:'décision',missions:'mission',idees:'idée',capsules:'capsule',rencontres:'rencontre'};function baseEdit(type,id,preset){let a=id?db[type].find(x=>x.id===id):null;if(id&&!a)return;editing={type,id};$('#editorTitle').textContent=(id?'Modifier : ':'Nouvelle saisie : ')+nouns[type];$('#error').textContent='';$('#fields').innerHTML=specs[type].map(([name,label,kind,required,opts])=>{let val=a?.[name]??(name==='category'&&preset?preset:kind==='date'?today():'');let attrs=`name="${name}" id="f_${name}" ${required?'required':''}`;let field=kind==='textarea'?`<textarea ${attrs} maxlength="4000">${esc(val)}</textarea>`:kind==='select'?`<select ${attrs}>${opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`:kind==='file'?`<input ${attrs} type="file" accept="image/png,image/jpeg,image/webp"><small>Max. 2 Mo avant redimensionnement. Contribution privée, après validation institutionnelle.</small>${val?'<label class="check"><input type="checkbox" name="removeImage"> Retirer l’image existante</label>':''}`:`<input ${attrs} type="${kind}" value="${esc(val)}" ${kind==='text'||kind==='url'?'maxlength="300"':''}>`;return `<div class="${['textarea','file'].includes(kind)||name==='title'?'full':''}"><label for="f_${name}">${esc(label)}${required?' *':''}</label>${field}</div>`}).join('');$('#editor').showModal()}
async function convertImage(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>2*1024*1024)throw Error('Choisissez une image JPG, PNG ou WebP de 2 Mo maximum.');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();let scale=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);let ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.72)}finally{URL.revokeObjectURL(url)}}
function download(){const blob=new Blob([JSON.stringify({version:2,data:db},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='patrimonio-'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}function validateBackup(x){if(![1,2].includes(x?.version)||!x.data)throw Error('Format de sauvegarde non reconnu.');let clean={};for(let [type,fields] of Object.entries(specs)){if(x.version===1&&!Object.hasOwn(x.data,type)&&['missions','idees','capsules','rencontres'].includes(type)){clean[type]=[];continue}if(!Array.isArray(x.data[type])||x.data[type].length>2000)throw Error('Rubrique invalide : '+type);let ids=new Set();clean[type]=x.data[type].map(a=>{if(!a||typeof a.id!=='string'||ids.has(a.id))throw Error('Identifiant invalide.');ids.add(a.id);let b={id:a.id};for(let [name,label,kind,required,opts] of fields){let v=a[name]??'';if(typeof v!=='string'||v.length>(kind==='file'?2000000:4000)||(required&&!v)||(kind==='select'&&!opts.includes(v))||(kind==='date'&&!/^\d{4}-\d{2}-\d{2}$/.test(v))||(kind==='file'&&v&&!/^data:image\/(png|jpeg|webp);base64,/.test(v)))throw Error('Valeur invalide : '+label);b[name]=v}return b})}return clean}

// V3 — données partagées, droits contrôlés en base, session uniquement en mémoire.
const cfg=window.PATRIMONIO_CONFIG||{}, endpoint=String(cfg.url||'').replace(/\/$/,''), pk=String(cfg.publishableKey||'');
const configured=/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(endpoint)&&/^sb_publishable_[A-Za-z0-9_-]+$/.test(pk);
let session=null, member=null, rows=new Map(), busy=false, epoch=0; const studentSections=['journal','ressources','idees','capsules','rencontres'];
const teacher=()=>member==='enseignant', rowKey=(section,id)=>section+'|'+id, getRow=(s,i)=>rows.get(rowKey(s,i));
function allowedNew(s){return !!member&&(teacher()||studentSections.includes(s))}function allowedEdit(s,i){let r=getRow(s,i);return !!r&&!!member&&(teacher()||(r.owner_id===session?.user?.id&&r.moderation!=='approved'&&studentSections.includes(s)))}
async function api(path,opts={},auth=true){let token=auth?session?.access_token:null;let res=await fetch(endpoint+path,{...opts,cache:'no-store',headers:{apikey:pk,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...opts.headers}});let raw=await res.text(), data;try{data=raw?JSON.parse(raw):null}catch{data=null}if(!res.ok)throw Error(res.status===401?'Session expirée ou identifiants incorrects. Reconnectez-vous.':(res.status===403?'Action non autorisée.':'Requête refusée ('+res.status+'). Vérifiez la configuration ou réessayez.'));return data}
function reset(){epoch++;session=null;member=null;rows.clear();db=Object.fromEntries(Object.keys(seed).map(k=>[k,[]]));warning='';$('#editor').close();$('#main').innerHTML='';$('#nav').innerHTML='';$('#main').hidden=true;$('#nav').hidden=true;view='accueil';}
function loginPanel(msg=''){const p=$('#cloudPanel');p.innerHTML=`<div class="cloudbox"><div class="eyebrow marker">ATELIER PRIVÉ / V3</div><h2>Bienvenue à l’atelier !</h2>${configured?`<p>Accès réservé aux comptes autorisés par l’établissement.</p><form id="login"><label for="loginEmail">Adresse de connexion</label><input id="loginEmail" type="email" autocomplete="username" required><label for="loginPass">Mot de passe</label><input id="loginPass" type="password" autocomplete="current-password" required><button class="btn" type="submit">Entrer dans l’atelier →</button></form>`:'<p>Le mode collaboratif n’est pas encore connecté. Le responsable de l’établissement doit configurer la base et les comptes autorisés. Aucun contenu n’est envoyé.</p>'}<p role="alert" id="loginMsg">${esc(msg)}</p></div>`;if(configured)$('#login').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;let pass=$('#loginPass'), email=$('#loginEmail').value;try{session=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password:pass.value})},false);pass.value='';let m=await api('/rest/v1/atelier_members?select=role&user_id=eq.'+encodeURIComponent(session.user.id));if(m.length!==1)throw Error('Ce compte n’est pas autorisé dans cet atelier.');member=m[0].role;await load();$('#main').hidden=false;$('#nav').hidden=false;render()}catch(err){reset();loginPanel(err.message)}finally{b.disabled=false}}}
async function load(){const generation=epoch;let next=new Map(), result=Object.fromEntries(Object.keys(seed).map(k=>[k,[]]));for(let start=0;;start+=100){let page=await api('/rest/v1/atelier_entries?select=*&order=section.asc,id.asc&limit=100&offset='+start);for(let r of page){if(!Object.hasOwn(result,r.section))continue;let a={id:r.id};for(let [field,,kind,,opts] of specs[r.section]){let v=r.payload?.[field];a[field]=typeof v==='string'?v.slice(0,kind==='file'?500000:4000):'';if(kind==='select'&&!opts.includes(a[field]))a[field]=opts[0];}if(r.section==='journal')a.status=r.moderation==='approved'?'Validé':r.moderation==='revision'?'À corriger':'À relire';next.set(rowKey(r.section,r.id),r);result[r.section].push(a)}if(page.length<100)break}if(generation!==epoch||!member)throw Error('Session fermée.');rows=next;db=result;warning=''}
function panel(){let count=[...rows.values()].filter(r=>r.moderation!=='approved').length;$('#cloudPanel').innerHTML=`<div class="cloudbox cloudbar"><strong>${teacher()?'ESPACE ENSEIGNANT':'ESPACE ÉLÈVE'} · Atelier privé</strong><span class="tag blue">${teacher()?count+' à traiter':'Mes contributions et contenus validés'}</span><button class="btn alt small" data-cloud="refresh">Actualiser</button>${teacher()?'<button class="btn alt small" data-cloud="queue">Relectures</button><button class="btn alt small" data-cloud="seed">Charger les jalons et objectifs initiaux</button>':''}<button class="btn alt small" data-cloud="logout">Déconnexion</button></div>`}
function editActions(s,i){let r=getRow(s,i);if(!r)return '';let label={pending:'À relire',revision:'À corriger',approved:'Validé'}[r.moderation];return `<div class="cloud-status">${status(label)}${r.review_note?`<p class="review-note">${esc(r.review_note)}</p>`:''}</div><div class="actions">${allowedEdit(s,i)?legacyEditActions(s,i):''}${teacher()&&r.moderation!=='approved'?button('Valider',`data-cloud="approve" data-section="${s}" data-id="${esc(i)}"`,'small')+button('Demander une correction',`data-cloud="revision" data-section="${s}" data-id="${esc(i)}"`,'small alt'):''}${teacher()&&r.moderation==='approved'?button('Retirer la validation',`data-cloud="revision" data-section="${s}" data-id="${esc(i)}"`,'small alt'):''}</div>`}
function render(){if(!member)return;panel();baseRender();document.querySelectorAll('[data-new]').forEach(b=>{if(!allowedNew(b.dataset.new))b.hidden=true});if(!teacher())document.querySelectorAll('[data-action="export"],[data-action="print"]').forEach(b=>b.hidden=true)}
function edit(s,i,preset){if(i?!allowedEdit(s,i):!allowedNew(s))return; baseEdit(s,i,preset);let state=$('#f_status');if(s==='journal'&&state){state.parentElement.hidden=true;state.disabled=true}let role=$('#f_role');if(role){role.value=teacher()?'Enseignant':'Élève';role.disabled=true;role.parentElement.hidden=true}}
async function saveRow(section,id,payload,old,moderation,review_note=''){const body={payload,moderation,review_note};let path='/rest/v1/atelier_entries';let method='POST';if(old){method='PATCH';path+='?section=eq.'+encodeURIComponent(section)+'&id=eq.'+encodeURIComponent(id)+'&revision=eq.'+old.revision}else Object.assign(body,{section,id});let result=await api(path,{method,headers:{Prefer:'return=representation'},body:JSON.stringify(body)});if(!result?.length)throw Error('Contribution modifiée ailleurs ou accès retiré. Actualisez puis réessayez.')}
$('#form').addEventListener('submit',async e=>{e.preventDefault();if(busy||!member)return;let b=e.submitter;b.disabled=true;busy=true;let generation=epoch;try{let {type,id}=editing,old=id?getRow(type,id):null;if(id?!allowedEdit(type,id):!allowedNew(type))throw Error('Action non autorisée.');let data=new FormData(e.target),a={};for(let [name,label,kind,required] of specs[type]){if(name==='status'&&type==='journal'){a[name]='À relire';continue}if(name==='role'&&type==='journal'){a[name]=teacher()?'Enseignant':'Élève';continue}if(kind==='file'){let f=data.get(name);a[name]=f?.size?await convertImage(f):data.has('removeImage')?'':old?.payload?.[name]||'';if(a[name].length>500000)throw Error('Image trop volumineuse après compression.')}else{a[name]=String(data.get(name)||'').trim();if(required&&!a[name])throw Error('Merci de renseigner : '+label)}}if(a.url&&!/^https:\/\//i.test(a.url))throw Error('Utilisez un lien HTTPS.');if(generation!==epoch)throw Error('Session fermée.');await saveRow(type,id||uid(),a,old,teacher()?(old?.moderation||'approved'):'pending');$('#editor').close();try{await load();go(type)}catch(err){warning='Saisie enregistrée, actualisation impossible : '+err.message;render()}}catch(err){$('#error').textContent=err.message}finally{busy=false;b.disabled=false}});
function queue(){view='queue';panel();$('#main').innerHTML=head('RELECTURE','Contributions à relire','Valider ou demander une correction avant partage dans l’atelier.')+([...rows.values()].filter(r=>r.moderation!=='approved').map(r=>`<article class="paper"><div class="meta">${esc(r.section)} · ${esc(r.payload.date||'')}</div><h3>${esc(r.payload.title)}</h3><p>${esc(r.payload.desc)}</p>${r.payload.image&&/^data:image\/(png|jpeg|webp);base64,/.test(r.payload.image)?`<img class="gallery-img" src="${esc(r.payload.image)}" alt="Trace de création">`:''}${editActions(r.section,r.id)}</article>`).join('')||empty('Aucune contribution en attente.'))}
async function action(d){if(d.cloud==='logout'){reset();loginPanel();return}if(!member||busy)return;busy=true;try{if(d.cloud==='refresh'){await load();view==='queue'&&teacher()?queue():render()}else if(d.cloud==='queue'&&teacher()){await load();queue()}else if(d.cloud==='seed'&&teacher()){if(!confirm('Ajouter uniquement les jalons et objectifs initiaux absents ?'))return;let existing=[...rows.keys()];let entries=['planning','objectifs'].flatMap(section=>seed[section].filter(a=>!existing.includes(rowKey(section,a.id))).map(({id,...payload})=>({section,id,payload,moderation:'approved'})));if(entries.length)await api('/rest/v1/atelier_entries?on_conflict=section,id',{method:'POST',headers:{Prefer:'resolution=ignore-duplicates'},body:JSON.stringify(entries)});await load();go('conduire')}else if(['approve','revision'].includes(d.cloud)&&teacher()){let r=getRow(d.section,d.id);if(!r)return;let note=d.cloud==='revision'?prompt('Retour à transmettre (sans données personnelles) :',''):'';if(note===null)return;await saveRow(r.section,r.id,r.payload,r,d.cloud==='approve'?'approved':'revision',note.slice(0,1000));await load();view==='queue'?queue():render()}else if(d.del&&allowedEdit(d.del,d.id)&&confirm('Supprimer cette contribution ?')){let r=getRow(d.del,d.id);let result=await api('/rest/v1/atelier_entries?section=eq.'+encodeURIComponent(r.section)+'&id=eq.'+encodeURIComponent(r.id)+'&revision=eq.'+r.revision,{method:'DELETE',headers:{Prefer:'return=representation'}});if(!result?.length)throw Error('Suppression refusée : actualisez.');await load();view==='queue'?queue():render()}}catch(err){alert(err.message)}finally{busy=false}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.cloud||d.del){action(d);return}if(!member||busy)return;if(d.go)go(d.go);else if(d.new){edit(d.new,undefined,d.preset);if(d.chapter==='001'&&allowedNew(d.new)&&$('#f_title')){$('#f_title').value='Et si tout commençait par un besoin ?';$('#f_desc').placeholder='Que constatons-nous ? Quel besoin identifions-nous et sur quels éléments nous appuyons-nous ?';$('#f_learn').placeholder='Qu’avons-nous compris du lien humain ?';$('#f_next').placeholder='Quelle réponse pourrions-nous explorer ou tester ?';}}else if(d.edit)edit(d.edit,d.id);else if(d.action==='print'&&teacher())window.print();else if(d.action==='export'&&teacher())download()});
loginPanel();
